name: CI/CD Pipeline with Gradle

on:
  push:
    branches: ["develop"]

env:
  DOCKER_IMAGE: ghcr.io/devheun/hearlers
  DOCKER_CONTAINER: hearlers
  KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
  KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
  GRPC_NEST_TARGET: ${{ secrets.DEV_GRPC_NEST_TARGET }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ["self-hosted"]

    steps:
      - name: Create .env file
        run: |
          echo "KAKAO_CLIENT_ID=${{ env.KAKAO_CLIENT_ID }}" > .env
          echo "KAKAO_ADMIN_KEY=${{ env.KAKAO_ADMIN_KEY }}" >> .env
          echo "JWT_SECRET=${{ env.JWT_SECRET }}" >> .env
          echo "SERVER_URL=${{ env.SERVER_URL }}" >> .env
          echo "GRPC_NEST_TARGET=${{ env.GRPC_NEST_TARGET }}" >> .env

      - name: Run Docker Container
        run: |
          sudo docker pull ${{ env.DOCKER_IMAGE }}:latest

          CONTAINER_ID=$(sudo docker ps -a -q -f name=${{ env.DOCKER_CONTAINER }})
          if [ -n "$CONTAINER_ID" ]; then
            echo "Stopping and removing existing container: $CONTAINER_ID"
            sudo docker stop $CONTAINER_ID && sudo docker rm $CONTAINER_ID
          fi

          sudo docker run --env-file ./.env --platform linux/amd64 -d -p ${{ secrets.PORT }}:${{ secrets.PORT }} --name ${{ env.DOCKER_CONTAINER }} --network gateway --restart always ${{ env.DOCKER_IMAGE }}:latest