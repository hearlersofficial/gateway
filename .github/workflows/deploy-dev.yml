name: CI/CD Pipeline with Gradle

on:
  push:
    branches: ["develop"]

env:
  DOCKER_IMAGE: ghcr.io/devheun/hearlers
  DOCKER_CONTAINER: hearlers
  KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
  KAKAO_ADMIN_KEY: ${{ secrets.KAKAO_ADMIN_KEY }}
  JWT_SECRET: ${{ secrets.JWT_SECRET }}
  SERVER_URL: ${{ secrets.DEV_SERVER_URL }}
  GRPC_NEST_TARGET: ${{ secrets.DEV_GRPC_NEST_TARGET }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: "recursive"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "corretto"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle Wrapper
        run: ./gradlew build

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Docker build and push
        uses: docker/build-push-action@v5
        with:
          platforms: linux/amd64
          context: .
          push: true
          tags: ${{ env.DOCKER_IMAGE }}:latest

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: "latest"

      - name: Configure SSH and known_hosts
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DEV_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Install k3s on remote server if not exists
        run: |
          ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} '
            if [ ! -f /usr/local/bin/k3s ]; then
              echo "k3s not found. Installing..."
              curl -sfL https://get.k3s.io | sh -s - --write-kubeconfig-mode 644 --tls-san ${{ secrets.DEV_SSH_HOST }}
            else
              echo "k3s is already installed."
            fi
          '

      - name: Fetch, modify, and secure Kubeconfig
        run: |
          ssh ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }} 'cat /etc/rancher/k3s/k3s.yaml' | sed "s/127.0.0.1/${{ secrets.DEV_SSH_HOST }}/" > kubeconfig.yaml
          chmod 600 kubeconfig.yaml

      - name: Lint Helm chart
        run: helm lint ./helm/gateway

      - name: Handle potential Helm lock
        run: |
          set +e
          STATUS_OUTPUT=$(helm status hearlers-gateway --namespace development --kubeconfig ./kubeconfig.yaml)
          EXIT_CODE=$?
          set -e
          if [ $EXIT_CODE -eq 0 ] && (echo "$STATUS_OUTPUT" | grep -q "STATUS: pending-"); then
            echo "Helm release 'hearlers-gateway' is in a pending state. Uninstalling the release to unlock."
            helm uninstall hearlers-gateway --namespace development --kubeconfig ./kubeconfig.yaml
            echo "Waiting for uninstall to complete..."
            sleep 15
          else
            echo "Helm release 'hearlers-gateway' is in a stable state or does not exist. Proceeding."
          fi

      - name: Deploy Gateway with Helm
        run: |
          helm upgrade --install hearlers-gateway ./helm/gateway \
            --kubeconfig ./kubeconfig.yaml \
            -f ./helm/gateway/values-development.yaml \
            --namespace development \
            --create-namespace \
            --wait \
            --set image.repository=${{ env.DOCKER_IMAGE }} \
            --set image.tag=latest \
            --set env.KAKAO_CLIENT_ID='${{ env.KAKAO_CLIENT_ID }}' \
            --set env.KAKAO_ADMIN_KEY='${{ env.KAKAO_ADMIN_KEY }}' \
            --set env.JWT_SECRET='${{ env.JWT_SECRET }}' \
            --set env.SERVER_URL='${{ env.SERVER_URL }}' \
            --set env.GRPC_NEST_TARGET='${{ env.GRPC_NEST_TARGET }}'
