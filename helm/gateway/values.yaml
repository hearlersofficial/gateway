replicaCount: 1

image:
  repository: ghcr.io/devheun/hearlers
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  targetPort: 8080
  nodePort: 8080

resources: {}

nodeSelector: {}
tolerations: []
affinity: {}
podAnnotations: {}

# Map of environment variables to inject into the container
# Example:
# env:
#   KAKAO_CLIENT_ID: "..."
#   JWT_SECRET: "..."
env: {}

probes:
  enabled: false
  liveness:
    path: /actuator/health/liveness
    initialDelaySeconds: 30
    periodSeconds: 10
  readiness:
    path: /actuator/health/readiness
    initialDelaySeconds: 15
    periodSeconds: 10
